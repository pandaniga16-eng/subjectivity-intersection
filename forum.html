<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forum - Subjectivity Intersection</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#f2f4f7}
header{height:56px;background:#1e2226;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0}
.logo{font-weight:900} .logo span{background:#2d6ff7;padding:4px 8px;border-radius:6px}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;overflow:hidden;margin-bottom:12px}
.btn{background:#2d6ff7;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
.input{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;margin:6px 0}
.q{padding:14px;border-bottom:1px solid #eee}
.qTitle{font-weight:700;font-size:15px;margin:4px 0}
.tag{font-size:11px;background:#f1f3f5;padding:4px 8px;border-radius:4px;margin-right:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
.modal.open{display:flex} .modalInner{background:#fff;width:100%;max-width:460px;border-radius:12px;padding:16px}
.chat{height:280px;overflow:auto;padding:10px;background:#f8fbff;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:12px;max-width:85%;font-size:13px}
.msg.ai{background:#fff;border:1px solid #dbe6ff} .msg.user{background:#2d6ff7;color:#fff;align-self:flex-end}
</style>
</head>
<body>
<header>
<div class="logo"><span>◈</span> Subjectivity Intersection</div>
<div style="display:flex;gap:8px">
<div id="userBox" onclick="openAuth()" style="font-size:13px;cursor:pointer">Guest • Login</div>
<a href="index.html" style="color:#fff;font-size:13px">← Poster</a>
</div>
</header>

<div class="layout">
<div>
<div class="card" style="padding:12px">
<button class="btn" onclick="openAsk()">Ask A Question</button>
<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
<button class="tag" onclick="filterCat('All')">All</button>
<button class="tag" onclick="filterCat('school')">school</button>
<button class="tag" onclick="filterCat('technology')">technology</button>
<button class="tag" onclick="filterCat('entertainment')">entertainment</button>
<button class="tag" onclick="filterCat('business')">business</button>
<button class="tag" onclick="filterCat('Braid Quantum Gravity')">Braid QG</button>
</div>
</div>

<div class="card">
<div style="padding:10px;border-bottom:1px solid #eee"><b>Recent Questions</b> <span id="qCount" style="float:right;font-size:12px;color:#666">0</span></div>
<div id="qList">Loading from Firebase...</div>
</div>
</div>

<div>
<div class="card"><div style="padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#eee"><div style="background:#fff;padding:10px;text-align:center"><small>Questions</small><b id="sQ">0</b></div><div style="background:#fff;padding:10px;text-align:center"><small>Users</small><b id="sU">0</b></div></div></div>

<div class="card">
<div style="padding:10px;font-weight:700">SIEL AI • Like ChatGPT</div>
<div class="chat" id="chatBox"><div class="msg ai"><b>SIEL AI:</b> Ask me anything about your papers. Grounded in DOI 23047902, 23284177.</div></div>
<div style="display:flex;gap:6px;padding:8px"><input id="chatInput" class="input" placeholder="Ask SIEL AI..." style="margin:0"><button class="btn" style="width:auto" onclick="sendChat()">Send</button></div>
</div>

<div class="card"><div style="padding:10px;font-weight:700">Groups</div><div id="groupList" style="padding:10px;font-size:13px">No groups yet</div><button class="btn" style="margin:10px" onclick="openGroup()">+ Create Group</button></div>
</div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal"><div class="modalInner">
<h3>1. User Accounts</h3>
<input id="email" class="input" placeholder="Email">
<input id="pass" type="password" class="input" placeholder="Password">
<button class="btn" onclick="signUp()">Create Account</button>
<button class="btn" style="background:#111;margin-top:6px" onclick="signIn()">Login</button>
<button class="btn" style="background:#fff;color:#111;border:1px solid #ddd;margin-top:6px" onclick="googleLogin()">Google Login</button>
<button class="btn" style="background:#e74c3c;margin-top:10px" onclick="signOut()">Logout</button>
<button class="btn" style="background:#eee;color:#111;margin-top:6px" onclick="closeAuth()">Close</button>
</div></div>

<!-- ASK MODAL -->
<div id="askModal" class="modal"><div class="modalInner">
<h3>2. Create Discussion</h3>
<input id="qTitle" class="input" placeholder="Title - e.g. How does intersection create world?">
<select id="qCat" class="input"><option>school</option><option>technology</option><option>entertainment</option><option>business</option><option>Braid Quantum Gravity</option><option>General</option></select>
<textarea id="qBody" class="input" placeholder="Details..."></textarea>
<button class="btn" onclick="postQ()">POST + SIEL AI will answer</button>
<button class="btn" style="background:#eee;color:#111;margin-top:6px" onclick="closeAsk()">Cancel</button>
</div></div>

<!-- GROUP MODAL -->
<div id="groupModal" class="modal"><div class="modalInner">
<h3>Create Group</h3>
<input id="gName" class="input" placeholder="Group name">
<textarea id="gDesc" class="input" placeholder="What is this group for?"></textarea>
<button class="btn" onclick="createGroup()">Create</button>
<button class="btn" style="background:#eee;color:#111;margin-top:6px" onclick="closeGroup()">Cancel</button>
</div></div>

<!-- ANSWERS MODAL -->
<div id="ansModal" class="modal"><div class="modalInner">
<h3 id="ansTitle"></h3>
<div id="ansList" style="max-height:300px;overflow:auto;margin:10px 0"></div>
<textarea id="ansInput" class="input" placeholder="Write answer or comment..."></textarea>
<button class="btn" onclick="postAns()">Post Answer (Like + Comment)</button>
<button class="btn" style="background:#eee;color:#111;margin-top:6px" onclick="closeAns()">Close</button>
</div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD5TT7In_Rvn-pmj1HyRKblF9fSYBhPuS8",
  authDomain: "subjectivity-intersection.firebaseapp.com",
  projectId: "subjectivity-intersection",
  storageBucket: "subjectivity-intersection.firebasestorage.app",
  messagingSenderId: "1002806897957",
  appId: "1:1002806897957:web:d8fb17e389e777f6c17ecc"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth();
let me=null, allQs=[], openQ=null, currentCat='All';

function aiAnswer(t){t=t.toLowerCase(); if(t.includes('subjectiv'))return 'Subjectivity is typed access mode. DOI 23047902'; if(t.includes('intersect'))return 'Intersection = ordered braid crossing → objective world emerges. DOI 23284177'; return 'World emerges when different subjectivities intersect. Steps: Different→Intersection→Objectivity→4D→Gravity→Einstein. pB=3/5';}

auth.onAuthStateChanged(u=>{me=u; userBox.textContent=u? u.email.split('@')[0] : 'Guest • Login';});

function openAuth(){authModal.classList.add('open')} function closeAuth(){authModal.classList.remove('open')}
function openAsk(){if(!me)return openAuth(); askModal.classList.add('open')} function closeAsk(){askModal.classList.remove('open')}
function openGroup(){if(!me)return openAuth(); groupModal.classList.add('open')} function closeGroup(){groupModal.classList.remove('open')}
function closeAns(){ansModal.classList.remove('open')}

async function signUp(){await auth.createUserWithEmailAndPassword(email.value,pass.value); closeAuth();}
async function signIn(){await auth.signInWithEmailAndPassword(email.value,pass.value); closeAuth();}
async function googleLogin(){await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); closeAuth();}
async function signOut(){await auth.signOut(); closeAuth();}

function sendChat(){const txt=chatInput.value.trim(); if(!txt)return; chatBox.innerHTML+=`<div class="msg user">${txt}</div><div class="msg ai"><b>SIEL AI:</b> ${aiAnswer(txt)}</div>`; chatInput.value=''; chatBox.scrollTop=chatBox.scrollHeight;}

async function postQ(){
const title=qTitle.value.trim(); if(!title)return alert('Add title');
const cat=qCat.value; const body=qBody.value;
const ai=aiAnswer(title+' '+body);
await db.collection('questions').add({title,cat,body,tags:[cat],name:me.email,uid:me.uid,likes:0,time:Date.now(),answers:[{name:'SIEL AI',text:ai+' [DOI 23047902,23284177]',time:Date.now()}]}); closeAsk(); qTitle.value=''; qBody.value='';
}
async function createGroup(){const n=gName.value.trim(); if(!n)return alert('name'); await db.collection('groups').add({name:n,desc:gDesc.value,uid:me.uid,members:[me.uid],time:Date.now()}); closeGroup();}

function filterCat(c){currentCat=c; render();}

function render(){
let list=[...allQs]; if(currentCat!=='All') list=list.filter(q=>q.cat===currentCat);
qCount.textContent=list.length+' Questions'; sQ.textContent=allQs.length; sU.textContent=new Set(allQs.map(q=>q.uid)).size;
qList.innerHTML=list.map(q=>`<div class="q"><div style="font-size:11px;color:#666">${q.name} • ${new Date(q.time).toLocaleDateString()} • <span style="background:#eef3ff;color:#2d6ff7;padding:2px 6px;border-radius:4px">${q.cat}</span></div><div class="qTitle">${q.title}</div><div style="font-size:12px;color:#555">${(q.body||'').slice(0,100)}</div><div style="margin-top:8px"><span class="tag">💬 ${q.answers?.length||0} Answers</span><span class="tag">👍 ${q.likes||0} Likes</span><button class="tag" style="background:#111;color:#fff" onclick="openAnswers('${q.id}')">Answer / Comment</button><button class="tag" onclick="like('${q.id}')">👍 Like</button></div></div>`).join('')||'No questions yet. Be first!';
}
async function like(id){if(!me)return openAuth(); const ref=db.collection('questions').doc(id); const d=await ref.get(); await ref.update({likes:(d.data().likes||0)+1});}
function openAnswers(id){openQ=allQs.find(x=>x.id===id); ansTitle.textContent=openQ.title; ansList.innerHTML=(openQ.answers||[]).map(a=>`<div style="padding:8px;border:1px solid #eee;border-radius:8px;margin-bottom:6px"><b style="font-size:12px">${a.name}</b><div style="font-size:13px">${a.text}</div></div>`).join(''); ansModal.classList.add('open');}
async function postAns(){if(!me)return openAuth(); const t=ansInput.value.trim(); if(!t)return; const ref=db.collection('questions').doc(openQ.id); const doc=await ref.get(); const ans=[...(doc.data().answers||[]),{name:me.email,text:t,time:Date.now()}]; await ref.update({answers:ans}); ansInput.value=''; openAnswers(openQ.id);}

db.collection('questions').orderBy('time','desc').onSnapshot(s=>{allQs=s.docs.map(d=>({id:d.id,...d.data()})); render();});
db.collection('groups').orderBy('time','desc').onSnapshot(s=>{groupList.innerHTML=s.docs.map(d=>{const g=d.data(); return `<div><b>${g.name}</b> • ${g.members?.length||1} members<br><small>${g.desc||''}</small><br><button class="tag" onclick="joinGroup('${d.id}')">Join</button></div><hr>`}).join('')||'No groups yet';});
async function joinGroup(id){if(!me)return openAuth(); const ref=db.collection('groups').doc(id); await ref.update({members:firebase.firestore.FieldValue.arrayUnion(me.uid)}); alert('Joined!');}
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
</script>
</body>
</html>
