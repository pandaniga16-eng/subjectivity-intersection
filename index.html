<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIEL — Braid QG Lab Forum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#04060a;color:#eaf0ff;overflow-x:hidden}
.mono{font-family:JetBrains Mono,monospace}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(8,10,16,0.85);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{font-weight:900;letter-spacing:-0.03em;font-size:16px}.logo span{color:#6ea8ff;font-weight:600}
.btn{border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;background:#2d6ff7;color:#fff;box-shadow:0 8px 24px rgba(45,111,247,0.35);transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn2{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#fff}
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(1200px 600px at 20% 10%, #142a6a 0%, transparent 60%),radial-gradient(1000px 600px at 90% 90%, #3a1a6a 0%, transparent 60%),#04060a}
canvas#main{position:fixed;inset:0;z-index:-2}
canvas#orb{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:760px;margin:80px auto 30px;padding:0 12px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:16px;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.input{width:100%;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:12px;color:#fff;margin:6px 0;font-size:14px}
.q{padding:16px;margin-top:14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0.05));border:1px solid rgba(255,255,255,0.12)}
.ans{margin-top:10px;margin-left:12px;padding:12px;border-radius:18px;background:rgba(45,111,247,0.10);border:1px solid rgba(110,168,255,0.18)}
.pic{max-width:100%;border-radius:14px;border:1px solid rgba(255,255,255,0.12);margin-top:8px;display:block}
.fileLabel{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px dashed rgba(255,255,255,0.2);font-size:12px;cursor:pointer;margin:4px 4px 0 0}
.vote{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vote button{border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;transition:0.15s}
.vote button.activeUp{background:#2d6ff7;border-color:#2d6ff7}
.vote button.activeDown{background:#ff4d6d;border-color:#ff4d6d}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(12px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{width:100%;max-width:440px;background:#111827;border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:16px}
.rec{width:42px;height:42px;border-radius:50%;background:#ff4d6d;display:flex;align-items:center;justify-content:center;border:0;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 0 16px rgba(255,77,109,0.6)}
.rec.recording{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
audio{width:100%;margin-top:8px;height:32px}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="main"></canvas>
<canvas id="orb"></canvas>

<header>
<div class="logo">SIEL <span>◈ Braid QG Lab</span></div>
<div style="display:flex;gap:8px"><a class="btn2 btn" href="https://www.researchgate.net/publication/414975934_Subjectivity-Intersection_Braid_Quantum_Gravity_From_a_Finite_Pointed-Braid_Source_to_Quantum_Structure_Lorentz_Geometry_and_Strong-Curvature_Spacetime_A_Constructive_Refutation_of_Objectivist_Primacy" target="_blank">Paper</a><span class="btn">Forum</span></div>
</header>

<div class="wrap">
<div class="card">
<h3 style="font-size:20px">Forum — WhatsApp Style</h3>
<p class="mono" style="font-size:11px;color:#8ea0c0;margin:4px 0 10px">Post question with pic + voice note. Reply the same.</p>
<input id="qTitle" class="input" placeholder="">
<textarea id="qBody" class="input" placeholder="" style="height:70px"></textarea>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">
<label class="fileLabel">📷 Pic <input type="file" id="qImage" accept="image/*" hidden></label>
<button id="qRecBtn" class="rec" onclick="toggleRec('q')">🎤</button>
<span id="qRecStatus" class="mono" style="font-size:11px;color:#ffb3c0"></span>
</div>
<div id="qPreview"></div>
<div id="qAudioPreview"></div>
<button class="btn" style="margin-top:10px;width:100%" onclick="postQ()">Post Question</button>
</div>

<div id="qList"></div>
</div>

<!-- ANSWER MODAL -->
<div id="ansModal" class="modal">
<div class="modalBox">
<h3>Reply</h3>
<input id="aName" class="input" placeholder="Your name">
<textarea id="aText" class="input" placeholder=""></textarea>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">
<label class="fileLabel">📷 Pic <input type="file" id="aImage" accept="image/*" hidden></label>
<button id="aRecBtn" class="rec" onclick="toggleRec('a')">🎤</button>
<span id="aRecStatus" class="mono" style="font-size:11px;color:#ffb3c0"></span>
</div>
<div id="aPreview"></div>
<div id="aAudioPreview"></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="submitAns()" style="flex:1">Post Reply</button><button class="btn btn2" onclick="closeAns()" style="flex:1">Cancel</button></div>
</div>
</div>

<script>
const bg=document.getElementById('main'); const bctx=bg.getContext('2d');
function rsize(){bg.width=innerWidth; bg.height=innerHeight; orb.width=innerWidth; orb.height=innerHeight} 
const orb=document.getElementById('orb'); const octx=orb.getContext('2d');
rsize(); addEventListener('resize',rsize);
let t=0;
function drawBG(){
 t+=0.008;
 bctx.clearRect(0,0,bg.width,bg.height);
 for(let k=0;k<9;k++){
  bctx.beginPath(); bctx.strokeStyle=`hsla(${220+k*14},90%,62%,${0.18})`; bctx.lineWidth=2;
  for(let x=0;x<bg.width;x+=10){ const y=bg.height*0.5 + Math.sin(x*0.008 + t*1.2 + k*0.9)*(80+k*14); if(x===0)bctx.moveTo(x,y); else bctx.lineTo(x,y); }
  bctx.stroke(); bctx.shadowBlur=18; bctx.shadowColor=`hsla(${220+k*14},90%,62%,0.7)`; bctx.stroke(); bctx.shadowBlur=0;
 }
 octx.clearRect(0,0,orb.width,orb.height);
 for(let i=0;i<22;i++){ const x=(Math.sin(t*0.3+i)*0.5+0.5)*orb.width; const y=(Math.cos(t*0.5+i*1.3)*0.5+0.5)*orb.height; octx.beginPath(); octx.arc(x,y,2.5,0,Math.PI*2); octx.fillStyle=`hsla(${210+i*10},90%,70%,0.9)`; octx.shadowBlur=16; octx.shadowColor=octx.fillStyle; octx.fill(); octx.shadowBlur=0; }
 requestAnimationFrame(drawBG);
}
drawBG();

let qs=JSON.parse(localStorage.getItem('sielQsV2')||'[]');
let pendingQImg=null, pendingAImg=null, pendingQAudio=null, pendingAAudio=null, curAnsIndex=null;
let mediaRecorder=null, recChunks=[], recType=null, recStream=null;

qImage.addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=ev=>{pendingQImg=ev.target.result; qPreview.innerHTML=`<img src="${pendingQImg}" class="pic"><button class="btn btn2" style="margin-top:6px" onclick="clearQImg()">Remove Pic</button>`}; r.readAsDataURL(f);
});
function clearQImg(){pendingQImg=null; qImage.value=''; qPreview.innerHTML='';}
aImage.addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=ev=>{pendingAImg=ev.target.result; aPreview.innerHTML=`<img src="${pendingAImg}" class="pic">`}; r.readAsDataURL(f);
});

async function toggleRec(type){
 const btn = type==='q'? qRecBtn : aRecBtn;
 const status = type==='q'? qRecStatus : aRecStatus;
 if(mediaRecorder && mediaRecorder.state==='recording'){
  mediaRecorder.stop(); btn.classList.remove('recording'); status.textContent=''; return;
 }
 try{
  recType=type;
  recStream = await navigator.mediaDevices.getUserMedia({audio:true});
  recChunks=[];
  mediaRecorder = new MediaRecorder(recStream);
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
   const blob=new Blob(recChunks,{type:'audio/webm'});
   const reader=new FileReader(); reader.onload=ev=>{
    const data=ev.target.result;
    if(recType==='q'){ pendingQAudio=data; qAudioPreview.innerHTML=`<audio controls src="${data}"></audio><button class="btn btn2" style="margin-top:4px" onclick="clearQAudio()">Remove Voice</button>`; }
    else { pendingAAudio=data; aAudioPreview.innerHTML=`<audio controls src="${data}"></audio>`; }
   }; reader.readAsDataURL(blob);
   recStream.getTracks().forEach(t=>t.stop());
  };
  mediaRecorder.start(); btn.classList.add('recording'); status.textContent='Recording... tap to stop';
 }catch(err){ alert('Mic permission needed for voice notes'); }
}
function clearQAudio(){ pendingQAudio=null; qAudioPreview.innerHTML=''; }
function clearAAudio(){ pendingAAudio=null; aAudioPreview.innerHTML=''; }

function render(){
 document.getElementById('qList').innerHTML=qs.map((q,qi)=>`
  <div class="q">
   <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${q.title}</b><span class="mono" style="font-size:10px;color:#8ea0c0">${new Date(q.time).toLocaleTimeString()}</span></div>
   <div style="font-size:14px;color:#d8e4f8;margin:8px 0;white-space:pre-wrap;line-height:1.5">${q.body}</div>
   ${q.image?`<img src="${q.image}" class="pic">`:''}
   ${q.audio?`<audio controls src="${q.audio}"></audio>`:''}
   <div class="vote">
    <button class="${q.myVote==='up'?'activeUp':''}" onclick="voteQ(${qi},'up')">👍 ${q.likes}</button>
    <button class="${q.myVote==='down'?'activeDown':''}" onclick="voteQ(${qi},'down')">👎 ${q.dislikes}</button>
    <button onclick="openAns(${qi})">💬 Reply with Pic/Voice</button>
   </div>
   <div>${q.answers.map((a,ai)=>`
    <div class="ans">
     <div style="font-size:13px"><b>${a.name}:</b> <span style="white-space:pre-wrap">${a.text}</span></div>
     ${a.image?`<img src="${a.image}" class="pic">`:''}
     ${a.audio?`<audio controls src="${a.audio}"></audio>`:''}
     <div class="vote">
      <button class="${a.myVote==='up'?'activeUp':''}" onclick="voteA(${qi},${ai},'up')">👍 ${a.likes}</button>
      <button class="${a.myVote==='down'?'activeDown':''}" onclick="voteA(${qi},${ai},'down')">👎 ${a.dislikes}</button>
     </div>
    </div>
   `).join('')}</div>
  </div>
 `).join('')||'<div style="text-align:center;color:#8ea0c0;padding:20px">No questions yet</div>';
}
function postQ(){
 const title=qTitle.value.trim(); const body=qBody.value.trim(); if(title.length<1 && !pendingQImg && !pendingQAudio) return alert('Write something or add pic/voice');
 qs.unshift({title:title||'Untitled',body,image:pendingQImg,audio:pendingQAudio,time:Date.now(),likes:0,dislikes:0,myVote:null,answers:[]}); save(); qTitle.value=''; qBody.value=''; clearQImg(); clearQAudio();
}
function voteQ(i,type){
 const q=qs[i]; if(q.myVote===type){ if(type==='up')q.likes--; else q.dislikes--; q.myVote=null; } else { if(q.myVote==='up')q.likes--; if(q.myVote==='down')q.dislikes--; if(type==='up')q.likes++; else q.dislikes++; q.myVote=type; } save();
}
function openAns(i){curAnsIndex=i; pendingAImg=null; pendingAAudio=null; aImage.value=''; aPreview.innerHTML=''; aAudioPreview.innerHTML=''; aName.value=''; aText.value=''; ansModal.style.display='flex';}
function closeAns(){ansModal.style.display='none';}
function submitAns(){
 const name=aName.value.trim()||'Guest'; const text=aText.value.trim(); if(!text && !pendingAImg && !pendingAAudio) return alert('Add text, pic or voice');
 qs[curAnsIndex].answers.push({name,text,image:pendingAImg,audio:pendingAAudio,likes:0,dislikes:0,myVote:null}); save(); closeAns();
}
function voteA(qi,ai,type){
 const a=qs[qi].answers[ai]; if(a.myVote===type){ if(type==='up')a.likes--; else a.dislikes--; a.myVote=null; } else { if(a.myVote==='up')a.likes--; if(a.myVote==='down')a.dislikes--; if(type==='up')a.likes++; else a.dislikes++; a.myVote=type; } save();
}
function save(){localStorage.setItem('sielQsV2',JSON.stringify(qs)); render();}
render();
</script>
</body>
</html>
