<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIEL — Braid Quantum Gravity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#04060a;color:#eaf0ff;overflow-x:hidden}
.mono{font-family:JetBrains Mono,monospace}
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(8,10,16,0.75);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{font-weight:900;letter-spacing:-0.03em;font-size:16px}.logo span{color:#6ea8ff;font-weight:600}
.btn{border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;background:#2d6ff7;color:#fff;box-shadow:0 8px 24px rgba(45,111,247,0.35);transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn2{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#fff}
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(1200px 600px at 20% 10%, #142a6a 0%, transparent 60%),radial-gradient(1000px 600px at 90% 90%, #3a1a6a 0%, transparent 60%),#04060a}
canvas#main{position:fixed;inset:0;z-index:-2}
canvas#orb{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:1150px;margin:96px auto 30px;padding:0 16px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:16px}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:18px;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.note{padding:12px;border-left:3px solid #2d6ff7;background:rgba(45,111,247,0.1);border-radius:0 14px 14px 0;margin:10px 0;font-size:13.5px;line-height:1.6}
.animStage{height:520px;border-radius:18px;overflow:hidden;position:relative;background:radial-gradient(500px 250px at 50% 0%, rgba(110,168,255,0.28), transparent), rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center}
.profLine{position:absolute;width:4px;height:300px;border-radius:4px;background:linear-gradient(180deg,#6ea8ff,#a78bfa,#ff7ab6);box-shadow:0 0 22px currentColor;animation:braid 3.2s ease-in-out infinite alternate}
@keyframes braid{0%{transform:translateY(-40px) rotate(-18deg) scaleY(0.9)}100%{transform:translateY(40px) rotate(18deg) scaleY(1.2)}}
.bubble{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff, #6ea8ff 60%, transparent);box-shadow:0 0 24px #6ea8ff, 0 0 48px #6ea8ff;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-70px)}}
.input{width:100%;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:12px;color:#fff;margin:6px 0;font-size:14px}
.q{padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
.vote{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vote button{border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;transition:0.15s}
.vote button:hover{background:rgba(255,255,255,0.12)}
.vote button.activeUp{background:#2d6ff7;border-color:#2d6ff7;box-shadow:0 0 12px rgba(45,111,247,0.6)}
.vote button.activeDown{background:#ff4d6d;border-color:#ff4d6d;box-shadow:0 0 12px rgba(255,87,109,0.6)}
.ans{margin-top:8px;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.08);padding:10px 12px;border-radius:14px}
.pic{max-width:100%;border-radius:14px;border:1px solid rgba(255,255,255,0.12);margin-top:8px;display:block}
.fileLabel{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px dashed rgba(255,255,255,0.2);font-size:12px;cursor:pointer;margin:4px 4px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modalBox{width:100%;max-width:440px;background:#111827;border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:16px}
.rec{width:42px;height:42px;border-radius:50%;background:#ff4d6d;display:flex;align-items:center;justify-content:center;border:0;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 0 16px rgba(255,77,109,0.6)}
.rec.recording{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
audio{width:100%;margin-top:8px;height:36px}
.wave{display:flex;gap:4px;align-items:center;margin-top:8px}
.bar{width:3px;background:#6ea8ff;border-radius:99px;animation:waveBar 0.8s ease-in-out infinite}
@keyframes waveBar{0%,100%{height:8px}50%{height:22px}}
.voiceBox{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 14px;margin-top:8px}
.chan{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chan:hover{background:rgba(255,255,255,0.09)}
.chModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}
.chBox{width:100%;max-width:420px;height:84vh;background:#0b141a;border:1px solid rgba(255,255,255,0.14);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.chHeader{background:#202c33;padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.chAvatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6ea8ff,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:900}
.chMsgs{flex:1;overflow-y:auto;padding:12px;background:radial-gradient(400px 300px at 50% 0%, rgba(110,168,255,0.15), transparent), #0b141a;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5}
.bub.me{align-self:flex-end;background:#005c4b;color:#e9edef;border-bottom-right-radius:2px}
.bub.other{align-self:flex-start;background:#202c33;color:#e9edef;border-bottom-left-radius:2px}
.chInput{display:flex;gap:8px;padding:10px;background:#202c33;border-top:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="main"></canvas>
<canvas id="orb"></canvas>

<header>
<div class="logo">SIEL <span>◈ Braid QG Lab</span></div>
<div style="display:flex;gap:8px"><a class="btn2 btn" href="https://www.researchgate.net/publication/414975934_Subjectivity-Intersection_Braid_Quantum_Gravity_From_a_Finite_Pointed-Braid_Source_to_Quantum_Structure_Lorentz_Geometry_and_Strong-Curvature_Spacetime_A_Constructive_Refutation_of_Objectivist_Primacy" target="_blank">📄</a><a class="btn" href="#forum">💬</a></div>
</header>

<div class="wrap">
<div>

<div class="card" style="padding:0;overflow:hidden">
<img src="IMG_2781.jpeg" style="width:100%;display:block;border-radius:22px" alt="IMG_2781">
<div style="padding:12px 16px;background:linear-gradient(180deg, #fef6ec, #fff8ef);color:#3d3a36;border-radius:0 0 22px 22px">
<div style="font-weight:900;font-size:18px">💬 skiii</div>
<div class="mono" style="font-size:11px;color:#6b6560;margin-top:4px">💬 + 👥 = 📢</div>
</div>
</div>

<div class="card" style="margin-top:14px">
<h3>📝</h3>
<div class="note">🎯 👓 → 👁️</div>
<div class="note">🔗 🎬 👥 🧠 ≠</div>
<div class="note">🌌 🧵 → 🏠</div>
<textarea id="myNote" class="input" style="height:68px" placeholder="✍️"></textarea>
<button class="btn" onclick="saveNote()">💾</button>

<h3>📢 Channels</h3>
<input id="chanName" class="input" placeholder="📢 Name">
<button class="btn" onclick="createChan()">➕</button>
<div id="chanList" style="margin-top:10px"></div>

</div>

<div>
<div class="card">
<h3>🌀 7 Braids</h3>
<div class="animStage" id="stage">
<div class="profLine" style="left:14%;height:280px;animation-delay:0s"></div>
<div class="profLine" style="left:26%;height:300px;animation-delay:0.1s;background:linear-gradient(180deg,#7affb6,#6ea8ff)"></div>
<div class="profLine" style="left:38%;height:320px;animation-delay:0.2s;background:linear-gradient(180deg,#ff7ab6,#a78bfa)"></div>
<div class="profLine" style="left:50%;height:340px;animation-delay:0.3s;background:linear-gradient(180deg,#6ea8ff,#ffe27a)"></div>
<div class="profLine" style="left:62%;height:320px;animation-delay:0.4s;background:linear-gradient(180deg,#a78bfa,#6ea8ff)"></div>
<div class="profLine" style="left:74%;height:300px;animation-delay:0.5s;background:linear-gradient(180deg,#ffe27a,#ff7ab6)"></div>
<div class="profLine" style="left:86%;height:280px;animation-delay:0.6s;background:linear-gradient(180deg,#7affb6,#a78bfa)"></div>
<div class="bubble" style="left:18%;top:65%"></div>
<div class="bubble" style="left:72%;top:28%;animation-delay:1s;background:radial-gradient(circle at 30% 30%, #fff, #ff7ab6 60%, transparent);box-shadow:0 0 24px #ff7ab6"></div>
<div class="bubble" style="left:50%;top:72%;animation-delay:2s;background:radial-gradient(circle at 30% 30%, #fff, #7affb6 60%, transparent);box-shadow:0 0 24px #7affb6"></div>
<div class="bubble" style="left:35%;top:20%;animation-delay:0.5s;background:radial-gradient(circle at 30% 30%, #fff, #ffe27a 60%, transparent);box-shadow:0 0 24px #ffe27a"></div>
<div style="position:absolute;bottom:10px;left:12px" class="mono"><span style="font-size:10px;padding:5px 10px;background:rgba(0,0,0,0.6);border-radius:999px;border:1px solid rgba(255,255,255,0.14)">7 🧵 • 9 🌊</span></div>
</div>
</div>

<h3>💬 Q&A</h3>
<input id="qTitle" class="input" placeholder="❓">

<div id="qList"></div>
</div>
</div>
</div>

<div id="ansModal" class="modal">

<input id="aName" class="input" placeholder="👤">
<textarea id="aText" class="input" placeholder="✍️"></textarea>

</div>

<div id="aAudioPreview"></div>

</div>
</div>

<!-- Channel Chat Modal -->
<div id="chModal" class="chModal">

<div class="chHeader">
<div style="display:flex;align-items:center;gap:10px">
<div id="chAvatar" class="chAvatar">📢</div>
<div><div id="chName" style="font-weight:700;font-size:14px">Channel</div><div id="chInfo" class="mono" style="font-size:11px;color:#8696a0">👥 • 💬</div></div>
</div>

</div>

<input id="chInput" class="input" style="margin:0" placeholder="💬 Message — followers only" onkeydown="if(event.key==='Enter')sendChMsg()">
<button class="btn" onclick="sendChMsg()">➤</button>
</div>
<div id="chFollowNote" style="padding:8px 12px;background:#202c33;text-align:center;display:none"><button class="btn" onclick="followCurrent()">👥 Follow to chat</button></div>
</div>
</div>

<script>
const bg=document.getElementById('main'); const bctx=bg.getContext('2d');
function rsize(){bg.width=innerWidth; bg.height=innerHeight; orb.width=innerWidth; orb.height=innerHeight;} 
const orb=document.getElementById('orb'); const octx=orb.getContext('2d');
rsize(); addEventListener('resize',rsize);
let t=0;
function drawBG(){
 t+=0.008;
 bctx.clearRect(0,0,bg.width,bg.height);
 for(let k=0;k<9;k++){
  bctx.beginPath(); bctx.strokeStyle=`hsla(${220+k*14},90%,62%,${0.2 + Math.sin(t+k)*0.08})`; bctx.lineWidth=2.2 + Math.sin(t+k)*1;
  for(let x=0;x<bg.width;x+=10){ const y=bg.height*0.5 + Math.sin(x*0.008 + t*1.2 + k*0.9)*(80+k*14) + Math.cos(t*0.5 + k)*28; if(x===0)bctx.moveTo(x,y); else bctx.lineTo(x,y); }
  bctx.stroke(); bctx.shadowBlur=20; bctx.shadowColor=`hsla(${220+k*14},90%,62%,0.85)`; bctx.stroke(); bctx.shadowBlur=0;
 }
 octx.clearRect(0,0,orb.width,orb.height);
 for(let i=0;i<24;i++){ const x=(Math.sin(t*0.3+i)*0.5+0.5)*orb.width; const y=(Math.cos(t*0.5+i*1.3)*0.5+0.5)*orb.height; const r=2+Math.sin(t+i)*1.6; octx.beginPath(); octx.arc(x,y,r,0,Math.PI*2); octx.fillStyle=`hsla(${210+i*10},90%,70%,0.95)`; octx.shadowBlur=20; octx.shadowColor=octx.fillStyle; octx.fill(); octx.shadowBlur=0; }
 requestAnimationFrame(drawBG);
}
drawBG();

myNote.value=localStorage.getItem('sielNote')||'';
function saveNote(){localStorage.setItem('sielNote',myNote.value);}

let qs=JSON.parse(localStorage.getItem('sielQsV2')||'[]');
let chans=JSON.parse(localStorage.getItem('sielChans')||'[]');
let pendingQImg=null, pendingAImg=null, pendingQAudio=null, pendingAAudio=null, curAnsIndex=null, editTarget=null, curCh=null;
let mediaRecorder=null, recChunks=[], recType=null, recStream=null;

qImage.addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=ev=>{pendingQImg=ev.target.result; qPreview.innerHTML=`<img src="${pendingQImg}" class="pic"><button class="btn2 btn" style="margin-top:6px" onclick="clearQImg()">✕</button>`}; r.readAsDataURL(f);
});
function clearQImg(){pendingQImg=null; qImage.value=''; qPreview.innerHTML='';}
aImage.addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=ev=>{pendingAImg=ev.target.result; aPreview.innerHTML=`<img src="${pendingAImg}" class="pic">`}; r.readAsDataURL(f);
});

async function toggleRec(type){
 const btn = type==='q'? document.getElementById('qRecBtn'): document.getElementById('aRecBtn');
 const status = type==='q'? document.getElementById('qRecStatus'): document.getElementById('aRecStatus');
 if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.stop(); btn.classList.remove('recording'); status.textContent=''; return; }
 try{
  recType=type; recStream = await navigator.mediaDevices.getUserMedia({audio:true});
  recChunks=[]; mediaRecorder = new MediaRecorder(recStream);
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
   const blob=new Blob(recChunks,{type:'audio/webm'});
   const reader=new FileReader(); reader.onload=ev=>{
    const data=ev.target.result;
    if(recType==='q'){ pendingQAudio=data; document.getElementById('qAudioPreview').innerHTML=`<div class="voiceBox"><button class="rec" style="width:32px;height:32px" onclick="new Audio('${data}').play()">▶</button><audio controls src="${data}" style="width:120px"></audio></div>`; }
    else { pendingAAudio=data; document.getElementById('aAudioPreview').innerHTML=`<div class="voiceBox"><button class="rec" style="width:32px;height:32px" onclick="new Audio('${data}').play()">▶</button><audio controls src="${data}" style="width:120px"></audio></div>`; }
   }; reader.readAsDataURL(blob);
   recStream.getTracks().forEach(t=>t.stop());
  };
  mediaRecorder.start(); btn.classList.add('recording'); status.textContent='●';
 }catch(err){ alert('🎤'); }
}
function clearQAudio(){ pendingQAudio=null; document.getElementById('qAudioPreview').innerHTML=''; }

function render(){
 qCount.textContent=qs.length+' 💬';
 let sorted=[...qs].sort((a,b)=>a.time-b.time);
 qList.innerHTML=sorted.map((q,qi)=>{
  let oi=qs.indexOf(q);
  return `<div class="q"><div style="display:flex;justify-content:space-between"><b class="mono" style="font-size:14px">Q${qi+1}: ${q.title}</b><span class="mono" style="font-size:10px;color:#8ea0c0">${new Date(q.time).toLocaleTimeString()}</span></div><div style="font-size:13px;color:#c2d0e8;margin:6px 0;white-space:pre-wrap">${q.body}</div>${q.image?`<img src="${q.image}" class="pic">`:''}${q.audio?`<audio controls src="${q.audio}"></audio>`:''}<div class="vote"><button class="${q.myVote==='up'?'activeUp':''}" onclick="voteQ(${oi},'up')">👍 ${q.likes}</button><button class="${q.myVote==='down'?'activeDown':''}" onclick="voteQ(${oi},'down')">👎 ${q.dislikes}</button><button onclick="openAns(${oi})">💬</button><button onclick="editQ(${oi})">✏️</button></div>${q.answers.length?`<div style="margin-top:10px">${q.answers.map((a,ai)=>`<div class="ans">• <b>${a.name}:</b> ${a.text} ${a.image?`<img src="${a.image}" class="pic">`:''} ${a.audio?`<audio controls src="${a.audio}"></audio>`:''}</div>`).join('')}</div>`:''}</div>`;
 }).join('')||'<div style="text-align:center;color:#8ea0c0;font-size:13px;padding:14px">∅</div>';
 renderChans();
}
function postQ(){
 const title=qTitle.value.trim(); const body=qBody.value.trim(); if(!title && !body && !pendingQImg && !pendingQAudio) return;
 if(editTarget && editTarget.type==='q'){ qs[editTarget.index].title=title||qs[editTarget.index].title; qs[editTarget.index].body=body||qs[editTarget.index].body; if(pendingQImg) qs[editTarget.index].image=pendingQImg; if(pendingQAudio) qs[editTarget.index].audio=pendingQAudio; editTarget=null; qTitle.value=''; qBody.value=''; clearQImg(); clearQAudio(); save(); return; }
 qs.push({title:title||'❓',body,image:pendingQImg,audio:pendingQAudio,time:Date.now(),likes:0,dislikes:0,myVote:null,answers:[]}); save(); qTitle.value=''; qBody.value=''; clearQImg(); clearQAudio();
}
function editQ(i){ qTitle.value=qs[i].title; qBody.value=qs[i].body; editTarget={type:'q',index:i}; }
function voteQ(i,type){ const q=qs[i]; if(q.myVote===type){ if(type==='up')q.likes--; else q.dislikes--; q.myVote=null; } else { if(q.myVote==='up')q.likes--; if(q.myVote==='down')q.dislikes--; if(type==='up')q.likes++; else q.dislikes++; q.myVote=type; } save(); }
function openAns(i){curAnsIndex=i; pendingAImg=null; pendingAAudio=null; aImage.value=''; aPreview.innerHTML=''; aAudioPreview.innerHTML=''; aName.value=''; aText.value=''; ansModal.style.display='flex';}
function closeAns(){ansModal.style.display='none';}
function submitAns(){ const name=aName.value.trim()||'👤'; const text=aText.value.trim(); if(!text && !pendingAImg && !pendingAAudio) return; qs[curAnsIndex].answers.push({name,text,image:pendingAImg,audio:pendingAAudio}); save(); closeAns(); }
function save(){localStorage.setItem('sielQsV2',JSON.stringify(qs)); localStorage.setItem('sielChans',JSON.stringify(chans)); render();}

// Channel logic — now opens, followers can send message
function createChan(){ const n=chanName.value.trim(); if(!n) return; chans.push({name:n,followers:1,followed:true,msgs:[{me:false,text:'📢 '+n+' — 💬',time:Date.now()}]}); chanName.value=''; save(); }
function renderChans(){
 if(chans.length===0){chanList.innerHTML='<div class="mono" style="font-size:11px;color:#8ea0c0">∅ 📢</div>'; return;}
 chanList.innerHTML=chans.map((c,i)=>`<div class="chan" onclick="openChannel(${i})"><div><div style="font-weight:700">📢 ${c.name}</div><div class="mono" style="font-size:11px;color:#8ea0c0">👥 ${c.followers} • 💬 ${c.msgs.length}</div></div><div style="display:flex;gap:6px"><button class="btn2 btn" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();toggleFollow(${i})">${c.followed?'✓':'＋'}</button><span>↗</span></div></div>`).join('');
}
function toggleFollow(i){ chans[i].followed=!chans[i].followed; chans[i].followers+=chans[i].followed?1:-1; save(); }
function openChannel(i){
 curCh=i; const c=chans[i];
 document.getElementById('chName').textContent='📢 '+c.name;
 document.getElementById('chInfo').textContent='👥 '+c.followers+' • '+(c.followed?'✓':'＋');
 document.getElementById('chAvatar').textContent=c.name[0].toUpperCase();
 document.getElementById('chModal').style.display='flex';
 renderChMsgs();
 const canChat=c.followed;
 document.querySelector('.chInput').style.display=canChat?'flex':'none';
 document.getElementById('chFollowNote').style.display=canChat?'none':'block';
}
function closeChannel(){ document.getElementById('chModal').style.display='none'; curCh=null; }
function renderChMsgs(){
 if(curCh===null) return;
 const c=chans[curCh];
 document.getElementById('chMsgs').innerHTML=c.msgs.map(m=>`<div class="bub ${m.me?'me':'other'}">${m.text}<div class="mono" style="font-size:9px;opacity:0.6;margin-top:2px">${new Date(m.time).toLocaleTimeString()}</div></div>`).join('');
 document.getElementById('chMsgs').scrollTop=99999;
}
function sendChMsg(){
 if(curCh===null) return;
 const c=chans[curCh];
 if(!c.followed) return;
 const txt=document.getElementById('chInput').value.trim(); if(!txt) return;
 c.msgs.push({me:true,text:txt,time:Date.now()});
 document.getElementById('chInput').value='';
 save(); renderChMsgs(); renderChans();
}
function followCurrent(){ if(curCh!==null){ chans[curCh].followed=true; chans[curCh].followers++; save(); openChannel(curCh); } }
render();
</script>
</body>
</html>
