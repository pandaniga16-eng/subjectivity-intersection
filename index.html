<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subjectivity-Intersection — LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#000;color:#e7e9ea}
.app{max-width:620px;margin:0 auto;min-height:100vh;background:#000;border-left:1px solid #1a1a1a;border-right:1px solid #1a1a1a;position:relative}
.top{position:sticky;top:0;z-index:50;background:#000;border-bottom:1px solid #2f3336}
.tabs{display:flex}
.tab{flex:1;padding:16px 0;text-align:center;font-size:15px;color:#71767b;cursor:pointer}
.tab.active{color:#fff;font-weight:700}
.header{padding:12px 16px;border-bottom:1px solid #2f3336;background:#000;display:flex;justify-content:space-between;align-items:center}
.input{width:100%;background:#202327;border:1px solid #333639;border-radius:24px;padding:14px 18px;color:#fff;font-size:15px;outline:none}
.textarea{width:100%;background:#202327;border:1px solid #333639;border-radius:16px;padding:14px 18px;color:#fff;font-size:15px;outline:none;resize:none;min-height:100px}
.btn{border:0;padding:0 22px;height:44px;border-radius:9999px;font-weight:700;cursor:pointer}
.btn-green{background:#25D366;color:#000}
.btn-white{background:#fff;color:#000}
.btn-dark{background:#2a3942;color:#fff}
.post-card{padding:14px 16px;border-bottom:1px solid #2f3336;background:#000}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1d9bf0,#8a2be2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.post-actions{display:flex;gap:24px;margin-top:12px;border-top:1px solid #1a1a1a;padding-top:10px}
.action{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;color:#71767b;user-select:none}
.action.liked{color:#f91880}
.group-item{padding:14px 16px;border-bottom:1px solid #1f2428;display:flex;gap:12px;align-items:center;cursor:pointer;background:#000}
.group-avatar{width:48px;height:48px;border-radius:50%;background:#25D366;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:0 auto;background:#000;border-top:1px solid #2f3336;display:flex;justify-content:space-around;align-items:center;height:64px;z-index:60}
.b-item{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#71767b;cursor:pointer}
.b-item.active{color:#fff}
.fab{position:fixed;bottom:80px;right:16px;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#000;cursor:pointer;z-index:55}
#groupModal{position:fixed;inset:0;background:#000;z-index:99999;display:none;flex-direction:column}
#groupModal.show{display:flex}
.gHeader{height:64px;background:#202327;padding:0 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2f3336}
.gMsgs{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px;background:#0b141a}
.bub{max-width:78%;padding:8px 12px;border-radius:8px;font-size:15px;word-break:break-word}
.bub.me{align-self:flex-end;background:#005c4b}
.bub.other{align-self:flex-start;background:#202c33}
.gInputWrap{padding:8px 12px;background:#202327;display:flex;gap:8px;align-items:center}
.gInput{flex:1;background:#2a3942;border:0;border-radius:24px;padding:12px 16px;color:#fff;font-size:15px;outline:none;resize:none;min-height:44px}
.forceModal{position:fixed;inset:0;background:#111b21;z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#202c33;border-radius:16px;padding:24px;text-align:center}
.smallModal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100001;display:none;align-items:center;justify-content:center;padding:20px}
.smallModal.show{display:flex}
.box2{width:100%;max-width:460px;background:#202c33;border-radius:16px;padding:20px;max-height:90vh;overflow-y:auto}
.appHeader{padding:10px 16px;border-bottom:1px solid #2f3336;display:flex;gap:8px;align-items:center;font-size:14px;background:#000}
.counter{background:#25D366;color:#000;padding:3px 10px;border-radius:9999px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="tabs"><div class="tab active" id="tab-feed" onclick="switchTab('feed')">For you</div><div class="tab" id="tab-comm" onclick="switchTab('comm')">Communities</div><div class="tab" id="tab-notes" onclick="switchTab('notes')">Simple Notes</div></div></div>
<div class="appHeader"><span>🟣 Subjectivity-Intersection</span><span id="topCounter">0 / 1000</span><span class="counter" id="badgeCounter">LIVE</span><span id="onlineStatus" style="margin-left:8px;font-size:11px;color:#25D366">● Connecting...</span></div>
<div id="view-feed"><div class="header"><div style="font-weight:800">For you</div><div style="font-size:12px" id="postCount">0 posts</div></div><div id="postsList"></div><div id="emptyFeed" style="padding:60px 20px;text-align:center;color:#555">No posts yet</div><div style="height:100px"></div></div>
<div id="view-comm" style="display:none"><div class="header"><div style="font-weight:800">Communities</div><div style="font-size:12px" id="groupCount">0 groups</div></div><div style="padding:12px 16px;display:flex;gap:10px;border-bottom:1px solid #2f3336"><input id="newGroupName" class="input" placeholder="Create community" style="flex:1"><button type="button" class="btn-white btn" id="createGroupBtn">Create</button></div><div id="groupsList"></div><div style="height:100px"></div></div>
<div id="view-notes" style="display:none"><div class="header"><div style="font-weight:800">Simple Notes</div><div style="font-size:12px" id="notesCount">0 notes</div></div><div style="padding:16px;border-bottom:1px solid #2f3336;background:#000"><div style="display:flex;gap:8px"><select id="noteForm" class="input" style="flex:1;border-radius:12px"><option>Form 1</option><option>Form 2</option><option>General</option></select><button type="button" class="btn-white btn" onclick="document.getElementById('noteImage').click()">🖼️</button><input type="file" id="noteImage" accept="image/*" hidden></div><textarea id="noteText" class="input" placeholder="Write note LIVE..." style="margin-top:10px;border-radius:12px;min-height:80px"></textarea><div id="noteImgPreview"></div><button type="button" class="btn-white btn" style="width:100%;margin-top:10px;height:44px" id="saveNoteBtn">Save LIVE</button></div><div id="notesList"></div><div style="height:100px"></div></div>
<div class="fab" id="fabBtn">+</div>
<div class="bottom"><div class="b-item active" id="b-feed" onclick="switchTab('feed')"><span>⌂</span><span>For you</span></div><div class="b-item" id="b-comm" onclick="switchTab('comm')"><span>⧉</span><span>Communities</span></div><div class="b-item" id="b-notes" onclick="switchTab('notes')"><span>📝</span><span>Notes</span></div></div>
</div>
<div id="groupModal">
<div class="gHeader">
<button type="button" class="btn btn-dark" style="width:40px;height:40px;border-radius:50%" id="closeGroupBtn">←</button>
<div class="group-avatar">⧉</div>
<div style="flex:1"><div id="gName">Group</div><div id="gInfo" style="font-size:12px;color:#8696a0"></div><div id="gAdmin" style="font-size:10px;color:#25D366;margin-top:2px"></div></div>
<button type="button" class="btn btn-white" style="height:36px;display:none" id="joinBtn">Join</button>
</div>
<div id="gMsgs" class="gMsgs"></div>
<div class="gInputWrap"><textarea id="gInput" class="gInput" rows="1" placeholder="Message LIVE"></textarea><button type="button" class="btn-green btn" style="width:44px;height:44px;border-radius:50%;padding:0" id="sendGroupBtn">➤</button></div>
</div>
<div id="forceLogin" class="forceModal"><div class="box"><h2>Join Subjectivity-Intersection</h2><div style="font-size:12px;color:#8696a0;margin-top:6px">1000 members • LIVE</div><input id="forceEmail" class="input" type="email" placeholder="Your email" style="margin-top:12px"><button type="button" class="btn btn-green" style="width:100%;margin-top:14px;height:46px" id="loginBtn">Continue</button><div id="forceError" style="display:none;color:#f15c6d;margin-top:10px;font-size:13px"></div></div></div>
<div id="postModal" class="smallModal"><div class="box2"><h3>Create Post LIVE</h3><textarea id="postBody" class="textarea" placeholder="What's happening in Subjectivity-Intersection?" style="margin-top:12px"></textarea><div id="postImgPreview" style="margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:14px"><button type="button" class="btn-white btn" onclick="document.getElementById('postImage').click()">🖼️ Picture</button><input type="file" id="postImage" accept="image/*" hidden><button type="button" class="btn-green btn" style="flex:1" id="publishBtn">Post LIVE</button></div><div id="postError" style="display:none;color:#f15c6d;font-size:12px;margin-top:8px"></div><button type="button" class="btn btn-dark" style="width:100%;margin-top:10px" id="closePostBtn">Cancel</button></div></div>
<div id="commentModal" class="smallModal"><div class="box2"><h3>Comments LIVE</h3><div id="commentPostPreview" style="margin-top:12px;padding:12px;background:#000;border-radius:12px;border:1px solid #1a1a1a"></div><div id="commentsList" style="margin-top:12px;max-height:250px;overflow-y:auto"></div><textarea id="commentText" class="textarea" placeholder="Write a comment LIVE..." style="margin-top:12px;min-height:70px"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="btn btn-dark" style="flex:1" id="closeCommentBtn">Close</button><button type="button" class="btn-green btn" style="flex:1" id="submitCommentBtn">Send LIVE</button></div><div id="commentError" style="display:none;color:#f15c6d;font-size:12px;margin-top:8px"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion, arrayRemove, increment, deleteDoc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBxIpjPvzWkviC_PxsZGHh0HEDBHw-cpww",
  authDomain: "siel-trinity.firebaseapp.com",
  projectId: "siel-trinity",
  storageBucket: "siel-trinity.firebasestorage.app",
  messagingSenderId: "231955952674",
  appId: "1:231955952674:web:e78f05e0f61c6af139467b",
  measurementId: "G-XF5S5BWG1L"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentUser = localStorage.getItem('sielEmail')||'';
let peopleCache=[]; let postsCache=[]; let groupsCache=[]; let notesCache=[]; let curGroup=null, pendingPostImg=null, pendingNoteImg=null, curCommentPostId=null;
function updateCounters(){ document.getElementById('topCounter').textContent = peopleCache.length+' / 1000'; document.getElementById('postCount').textContent = postsCache.length+' posts'; document.getElementById('groupCount').textContent = groupsCache.length+' groups'; document.getElementById('notesCount').textContent = notesCache.length+' notes'; }
function checkLogin(){ document.getElementById('forceLogin').style.display = currentUser ? 'none' : 'flex'; updateCounters(); }
checkLogin();
document.getElementById('loginBtn').onclick = async ()=>{
  let e=document.getElementById('forceEmail').value.trim().toLowerCase();
  let err=document.getElementById('forceError');
  if(!e.includes('@')){ err.style.display='block'; err.textContent='Enter valid email'; return; }
  currentUser=e; localStorage.setItem('sielEmail',e);
  try{ await setDoc(doc(db,'trinity_users',e), { email:e, joinedAt: serverTimestamp() }, {merge:true}); }catch(ex){ console.log(ex); }
  checkLogin();
};
function renderPosts(){
  let plist=document.getElementById('postsList'); let empty=document.getElementById('emptyFeed');
  if(postsCache.length===0){ plist.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  plist.innerHTML=postsCache.map(p=>{
    let name=(p.email||'anon').split('@')[0]; let isLiked = p.likedBy && p.likedBy.includes(currentUser); let comments = p.comments||[]; let id = p.id;
    return `<div class="post-card"><div style="display:flex;gap:12px"><div class="avatar">${name[0].toUpperCase()}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><div style="font-weight:700">@${name}</div><div style="font-size:11px;color:#555">${p.time? new Date(p.time.seconds? p.time.seconds*1000 : p.time).toLocaleString() : ''}</div></div>${p.body?`<div style="margin-top:6px;white-space:pre-wrap;word-break:break-word">${p.body}</div>`:''}${p.image?`<img src="${p.image}" style="width:100%;border-radius:12px;margin-top:10px;border:1px solid #222;display:block">`:''}<div class="post-actions"><div class="action ${isLiked?'liked':''}" data-like="${id}"><span>${isLiked?'❤️':'♡'}</span><span>${p.likes||0} Likes</span></div><div class="action" data-comment="${id}"><span>💬</span><span>${comments.length} Comments</span></div><div class="action" data-del="${id}" style="margin-left:auto;color:#f15c6d">🗑 Delete</div></div></div></div></div>`;
  }).join('');
  plist.querySelectorAll('[data-like]').forEach(el=> el.onclick=()=> likePost(el.getAttribute('data-like')));
  plist.querySelectorAll('[data-comment]').forEach(el=> el.onclick=()=> openCommentModal(el.getAttribute('data-comment')));
  plist.querySelectorAll('[data-del]').forEach(el=> el.onclick=()=> deletePost(el.getAttribute('data-del')));
}
function renderGroups(){
  let sorted=[...groupsCache].sort((a,b)=> (b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
  document.getElementById('groupsList').innerHTML=sorted.map(g=>{
    let last=g.msgs && g.msgs[g.msgs.length-1]; let preview = last ? last.text.slice(0,60) : 'Tap to open messages';
    return `<div class="group-item" data-gid="${g.id}"><div class="group-avatar">⧉</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><div style="font-weight:700">${g.name}</div><div style="font-size:11px;color:#555">${last?.time? new Date(last.time.seconds*1000).toLocaleTimeString():''}</div></div><div style="font-size:11px;color:#25D366">Admin: ${(g.admin||'').split('@')[0]} (creator)</div><div style="font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${preview}</div></div></div>`;
  }).join('');
  document.querySelectorAll('[data-gid]').forEach(el=> el.onclick=()=> openGroup(el.getAttribute('data-gid')));
}
function renderNotes(){ document.getElementById('notesList').innerHTML=notesCache.slice().reverse().map(n=>`<div style="padding:14px 16px;border-bottom:1px solid #222;display:flex;gap:12px"><div class="avatar" style="width:36px;height:36px;font-size:12px">${(n.form||'N')[0]}</div><div style="flex:1"><div style="font-weight:700">${n.form}</div><div style="margin-top:4px;white-space:pre-wrap">${n.body||''}</div>${n.image?`<img src="${n.image}" style="width:100%;border-radius:10px;margin-top:8px">`:''}</div></div>`).join('')||'<div style="padding:40px;text-align:center;color:#555">No notes</div>'; }
window.switchTab = function(name){
  document.getElementById('tab-feed').classList.remove('active'); document.getElementById('tab-comm').classList.remove('active'); document.getElementById('tab-notes').classList.remove('active');
  document.getElementById('b-feed').classList.remove('active'); document.getElementById('b-comm').classList.remove('active'); document.getElementById('b-notes').classList.remove('active');
  document.getElementById('view-feed').style.display='none'; document.getElementById('view-comm').style.display='none'; document.getElementById('view-notes').style.display='none';
  if(name==='feed'){ document.getElementById('tab-feed').classList.add('active'); document.getElementById('b-feed').classList.add('active'); document.getElementById('view-feed').style.display='block'; }
  if(name==='comm'){ document.getElementById('tab-comm').classList.add('active'); document.getElementById('b-comm').classList.add('active'); document.getElementById('view-comm').style.display='block'; }
  if(name==='notes'){ document.getElementById('tab-notes').classList.add('active'); document.getElementById('b-notes').classList.add('active'); document.getElementById('view-notes').style.display='block'; }
}
function compressImage(file, callback){
  let reader=new FileReader();
  reader.onload=function(e){
    let img=new Image();
    img.onload=function(){
      let canvas=document.createElement('canvas'); let maxW=600; let scale=Math.min(1, maxW/img.width); canvas.width=img.width*scale; canvas.height=img.height*scale; let ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height); let compressed=canvas.toDataURL('image/jpeg',0.5); callback(compressed);
    }; img.src=e.target.result;
  }; reader.readAsDataURL(file);
}
document.getElementById('postImage').addEventListener('change',function(e){
  let f=e.target.files[0]; if(!f) return; compressImage(f,function(compressed){ pendingPostImg=compressed; document.getElementById('postImgPreview').innerHTML='<img src="'+pendingPostImg+'" style="width:100%;border-radius:12px"><button type="button" id="rmImg" style="margin-top:6px;background:#f15c6d;color:#fff;border:0;padding:4px 10px;border-radius:9999px;font-size:11px">Remove</button>'; document.getElementById('rmImg').onclick=()=>{ pendingPostImg=null; document.getElementById('postImgPreview').innerHTML=''; document.getElementById('postImage').value=''; }; });
});
document.getElementById('fabBtn').onclick=()=>{ document.getElementById('postError').style.display='none'; document.getElementById('postModal').classList.add('show'); }
document.getElementById('closePostBtn').onclick=()=>{ document.getElementById('postModal').classList.remove('show'); }
document.getElementById('closeCommentBtn').onclick=()=>{ document.getElementById('commentModal').classList.remove('show'); curCommentPostId=null; }
document.getElementById('publishBtn').onclick = async ()=>{
  let bodyEl=document.getElementById('postBody'); let body=bodyEl.value.trim(); let err=document.getElementById('postError');
  if(!currentUser){ err.style.display='block'; err.textContent='Login first'; return; }
  if(!body && !pendingPostImg){ err.style.display='block'; err.textContent='Write words or add picture'; return; }
  document.getElementById('publishBtn').textContent='Posting LIVE...';
  try{ await addDoc(collection(db,'posts'), { body, image:pendingPostImg||null, email:currentUser, time:serverTimestamp(), likes:0, likedBy:[], comments:[] }); bodyEl.value=''; pendingPostImg=null; document.getElementById('postImgPreview').innerHTML=''; document.getElementById('postModal').classList.remove('show'); }catch(e){ err.style.display='block'; err.textContent='Error: '+e.message; }
  document.getElementById('publishBtn').textContent='Post LIVE';
};
async function likePost(id){ let ref=doc(db,'posts',id); let post=postsCache.find(p=>p.id===id); if(post.likedBy?.includes(currentUser)) await updateDoc(ref,{likedBy:arrayRemove(currentUser),likes:increment(-1)}); else await updateDoc(ref,{likedBy:arrayUnion(currentUser),likes:increment(1)}); }
async function deletePost(id){ if(confirm('Delete?')) await deleteDoc(doc(db,'posts',id)); }
function openCommentModal(id){ let p=postsCache.find(x=>x.id===id); if(!p) return; curCommentPostId=id; document.getElementById('commentPostPreview').innerHTML=`<b>@${p.email.split('@')[0]}</b><div>${p.body||''}</div>`; document.getElementById('commentsList').innerHTML=(p.comments||[]).map(c=>`<div>${c.name}: ${c.text}</div>`).join('')||'No comments'; document.getElementById('commentModal').classList.add('show'); }
document.getElementById('submitCommentBtn').onclick=async()=>{ let txt=document.getElementById('commentText').value.trim(); if(!txt) return; await updateDoc(doc(db,'posts',curCommentPostId),{comments:arrayUnion({name:currentUser.split('@')[0],text:txt,email:currentUser,time:Date.now()})}); document.getElementById('commentText').value=''; };
document.getElementById('createGroupBtn').onclick=async()=>{ let name=document.getElementById('newGroupName').value.trim(); if(!name) return alert('Enter name'); await addDoc(collection(db,'groups'),{name,admin:currentUser,members:[currentUser],msgs:[{email:'system',name:'System',text:'Group created by '+currentUser.split('@')[0],time:{seconds:Date.now()/1000}}],updatedAt:serverTimestamp(),createdAt:serverTimestamp()}); document.getElementById('newGroupName').value=''; };
function openGroup(id){ let g=groupsCache.find(x=>x.id===id); if(!g) return; curGroup=g; document.getElementById('gName').textContent=g.name; document.getElementById('gInfo').textContent=`${g.members.length} members • LIVE`; document.getElementById('gAdmin').textContent=`Admin: ${(g.admin||'').split('@')[0]} (creator)`; document.getElementById('joinBtn').style.display=g.members.includes(currentUser)?'none':'block'; document.getElementById('groupModal').classList.add('show'); renderGroupMsgs(); }
document.getElementById('closeGroupBtn').onclick=()=>{ document.getElementById('groupModal').classList.remove('show'); curGroup=null; }
document.getElementById('joinBtn').onclick=async()=>{ if(!curGroup) return; await updateDoc(doc(db,'groups',curGroup.id),{members:arrayUnion(currentUser),msgs:arrayUnion({email:'system',name:'System',text:currentUser.split('@')[0]+' joined',time:{seconds:Date.now()/1000}}),updatedAt:serverTimestamp()}); document.getElementById('joinBtn').style.display='none'; };
function renderGroupMsgs(){ if(!curGroup) return; let fresh=groupsCache.find(x=>x.id===curGroup.id)||curGroup; document.getElementById('gMsgs').innerHTML=(fresh.msgs||[]).map((m,idx)=>{ let isMe=m.email===currentUser; let isAdmin=fresh.admin===currentUser; let canEdit=isMe&&m.email!=='system'; let controls=''; if(canEdit) controls=`<div style="margin-top:6px;display:flex;gap:10px"><span style="font-size:11px;color:#25D366;cursor:pointer;font-weight:700" data-edit="${idx}">✏️ Edit</span><span style="font-size:11px;color:#f15c6d;cursor:pointer;font-weight:700" data-delmsg="${idx}">🗑 Delete</span></div>`; else if(isAdmin&&m.email!=='system') controls=`<div style="margin-top:6px"><span style="font-size:11px;color:#f15c6d;cursor:pointer" data-delmsg="${idx}">🗑 Delete (Admin)</span></div>`; let edited=m.edited?' (edited)':''; return `<div class="bub ${isMe?'me':'other'}"><div style="font-weight:700;font-size:12px">${m.name||m.email?.split('@')[0]}${edited}</div><div style="margin-top:2px;white-space:pre-wrap">${m.text}</div>${controls}</div>`; }).join(''); setTimeout(()=>{ document.getElementById('gMsgs').scrollTop=document.getElementById('gMsgs').scrollHeight; },30); document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>editGroupMsg(parseInt(el.getAttribute('data-edit')))); document.querySelectorAll('[data-delmsg]').forEach(el=>el.onclick=()=>deleteGroupMsg(parseInt(el.getAttribute('data-delmsg')))); }
async function editGroupMsg(idx){ let fresh=groupsCache.find(x=>x.id===curGroup.id); let msg=fresh.msgs[idx]; if(msg.email!==currentUser) return alert('Only own'); let newText=prompt('Edit:',msg.text); if(!newText) return; let newMsgs=[...fresh.msgs]; newMsgs[idx]={...msg,text:newText.trim(),edited:true}; await updateDoc(doc(db,'groups',curGroup.id),{msgs:newMsgs,updatedAt:serverTimestamp()}); }
async function deleteGroupMsg(idx){ if(!confirm('Delete for everyone?')) return; let fresh=groupsCache.find(x=>x.id===curGroup.id); let newMsgs=fresh.msgs.filter((_,i)=>i!==idx); await updateDoc(doc(db,'groups',curGroup.id),{msgs:newMsgs,updatedAt:serverTimestamp()}); }
document.getElementById('sendGroupBtn').onclick=async()=>{ let inp=document.getElementById('gInput'); let txt=inp.value.trim(); if(!txt) return; await updateDoc(doc(db,'groups',curGroup.id),{msgs:arrayUnion({email:currentUser,name:currentUser.split('@')[0],text:txt,time:{seconds:Date.now()/1000}}),members:arrayUnion(currentUser),updatedAt:serverTimestamp()}); inp.value=''; };
document.getElementById('noteImage').addEventListener('change',function(e){ let f=e.target.files[0]; if(!f)return; compressImage(f,function(c){ pendingNoteImg=c; document.getElementById('noteImgPreview').innerHTML='<img src="'+pendingNoteImg+'" style="width:100%;border-radius:12px;margin-top:8px">'; }); });
document.getElementById('saveNoteBtn').onclick=async()=>{ let text=document.getElementById('noteText').value.trim(); let form=document.getElementById('noteForm').value; if(!text&&!pendingNoteImg) return alert('Write note'); await addDoc(collection(db,'notes'),{form,body:text,image:pendingNoteImg||null,email:currentUser,time:serverTimestamp()}); document.getElementById('noteText').value=''; document.getElementById('noteImgPreview').innerHTML=''; pendingNoteImg=null; };
onSnapshot(query(collection(db,'posts'), orderBy('time','desc')), (snap)=>{ postsCache=snap.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('onlineStatus').textContent='● LIVE ONLINE'; updateCounters(); renderPosts(); });
onSnapshot(collection(db,'trinity_users'), (snap)=>{ peopleCache=snap.docs.map(d=>d.data()); updateCounters(); });
onSnapshot(collection(db,'groups'), (snap)=>{ groupsCache=snap.docs.map(d=>({id:d.id,...d.data()})); updateCounters(); renderGroups(); if(curGroup) renderGroupMsgs(); });
onSnapshot(collection(db,'notes'), (snap)=>{ notesCache=snap.docs.map(d=>({id:d.id,...d.data()})); updateCounters(); renderNotes(); });
switchTab('feed');
</script>
